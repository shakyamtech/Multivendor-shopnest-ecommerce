<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 72" width="320" height="72">
  <defs>
    <linearGradient id="yellowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF033"/>
      <stop offset="100%" stop-color="#FF9900"/>
    </linearGradient>
    <linearGradient id="toteGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0E518D"/>
      <stop offset="100%" stop-color="#08335C"/>
    </linearGradient>
    <filter id="subtleGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2.5" stdDeviation="3" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <g filter="url(#subtleGlow)">
    <!-- Golden Circle Badge -->
    <g transform="translate(4, 4)">
      <circle cx="32" cy="32" r="30" fill="url(#yellowGrad)"/>
      
      <!-- Cute Tote Bag Handles (Arched) -->
      <path d="M 23 25 C 23 15, 29 15, 29 25" fill="none" stroke="url(#toteGrad)" stroke-width="3.2" stroke-linecap="round"/>
      <path d="M 35 25 C 35 15, 41 15, 41 25" fill="none" stroke="url(#toteGrad)" stroke-width="3.2" stroke-linecap="round"/>

      <!-- Cute Tote Bag Body -->
      <path d="M 19 25 L 17 41 C 16.5 45 19 47.5 23 47.5 L 41 47.5 C 45 47.5 47.5 45 47 41 L 45 25 Z" fill="url(#toteGrad)"/>
      
      <!-- Tote Bag Rim / Fold line -->
      <path d="M 18 25 L 46 25" fill="none" stroke="#2274C4" stroke-width="2" stroke-linecap="round"/>

      <!-- Cute Pocket on Tote Front -->
      <path d="M 26 31 L 38 31 C 38 31 38.5 39 32 39 C 25.5 39 26 31 26 31 Z" fill="#1366B5" opacity="0.9"/>
      
      <!-- Cute 'S' Stitching on Pocket -->
      <path d="M 30.5 33.5 C 30.5 32.5 31.2 32 32 32 C 32.8 32 33.5 32.5 33.5 33.3 C 33.5 35 30.5 35.2 30.5 36.7 C 30.5 37.5 31.2 38 32 38 C 32.8 38 33.5 37.4 33.5 36.6" fill="none" stroke="#FFF033" stroke-width="1.8" stroke-linecap="round"/>
      
      <!-- Cute Small Hanging Tag/Keychain on Handle -->
      <circle cx="21" cy="27" r="1.5" fill="#FFF033"/>
      <path d="M 20 28 L 17 33 L 20 35 L 21 30 Z" fill="#FF5577"/>
    </g>

    <!-- Shopnest Typography -->
    <text x="78" y="49" font-family="'Montserrat', 'Barlow', 'Open Sans', 'Segoe UI', sans-serif" font-weight="700" font-size="38" fill="#FFFFFF" letter-spacing="-0.5">shop<tspan font-weight="800" fill="#FFF033">nest</tspan></text>
  </g>
</svg>
